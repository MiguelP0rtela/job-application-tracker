name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: password
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U jobtracker -d job_tracker_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://jobtracker:password@localhost:5432/job_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://jobtracker:password@localhost:5432/job_tracker_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest